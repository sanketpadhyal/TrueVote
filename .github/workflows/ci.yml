name: TrueVote CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Run Tests, Coverage & Build (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite & Generate Coverage
        run: npm test -- --watchAll=false --passWithNoTests --coverage
        env:
          CI: true

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Build Application (Production)
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truevote-production-build
          path: build/
          retention-days: 7
